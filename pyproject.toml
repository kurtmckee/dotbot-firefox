[project]
name = "dotbot-firefox"
dynamic = ["version"]
description = "Configure your Firefox profile(s) using dotbot"
authors = [
    { name = "Kurt McKee", email = "contactme@kurtmckee.org" },
]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.10"
keywords = [
    "dotbot",
    "dotbot-plugin",
    "dotfiles",
    "firefox",
]
dependencies = [
    "dotbot >=1.20.1",
]

[project.urls]
Repository = "https://github.com/kurtmckee/dotbot-firefox"
Changelog = "https://github.com/kurtmckee/dotbot-firefox/blob/main/CHANGELOG.rst"
"Donate via GitHub" = "https://github.com/sponsors/kurtmckee"

[build-system]
requires = ["flit_core >=3.12.0,<4"]
build-backend = "flit_core.buildapi"


# chipshot
# --------

[tool.chipshot]
template = """
This file is a part of dotbot-firefox <https://github.com/kurtmckee/dotbot-firefox>
Copyright 2022-2026 Kurt McKee <contactme@kurtmckee.org>
SPDX-License-Identifier: MIT
"""


# coverage
# --------

[tool.coverage.run]
branch = true
parallel = true
data_file = ".tox/.coverage-data-files/.coverage"
source = [
    "dotbot_firefox",
    "tests",
]

[tool.coverage.paths]
source = [
    "src",
    "*/site-packages",
]

[tool.coverage.report]
fail_under = 100


# flake8
# ------

[tool.flake8]
max-line-length = 80
extend-select = ["B950"]
extend-ignore = ["E203", "E501", "E701"]


# mypy
# ----

[tool.mypy]
packages = "dotbot_firefox"
strict = true
sqlite_cache = true

[[tool.mypy.overrides]]
module = [
    "dotbot.*",
    "pytest",
]
ignore_missing_imports = true


# pytest
# ------

[tool.pytest.ini_options]
addopts = "--color=yes"
filterwarnings = [
    "error",
]


# scriv
# -----

[tool.scriv]
version = "literal: dotbot_firefox.py: __version__"
categories = [
    "Python support",
    "Added",
    "Removed",
    "Changed",
    "Fixed",
    "Development",
]
